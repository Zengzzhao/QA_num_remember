<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽题背诵测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4f7cff;
      --success: #22c55e;
      --danger: #ef4444;
      --bg-top: #f5f7ff;
      --bg-bottom: #ffffff;
      --text: #1f2937;
      --text-soft: #6b7280;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: #eef1f8;
    }

    .app {
      height: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* 上半部分：问题区 */
    .question-area {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, var(--bg-top), #e9efff);
      text-align: center;
    }

    .counter {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 14px;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .btn-home {
      position: absolute;
      top: 12px;
      left: 20px;
      font-size: 14px;
      color: var(--primary);
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .question-label {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--primary);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: clamp(22px, 5vw, 36px);
      line-height: 1.5;
      font-weight: 700;
      max-width: 720px;
    }

    .question-text.empty {
      color: var(--text-soft);
      font-weight: 600;
    }

    /* 下半部分：交互区 */
    .control-area {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-bottom);
      gap: 20px;
    }

    /* 答案区，带平滑过渡 */
    .answer-box {
      width: 100%;
      max-width: 600px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(8px);
      transition: max-height 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
    }

    .answer-box.show {
      max-height: 400px;
      opacity: 1;
      transform: translateY(0);
    }

    .answer-card {
      background: #f8fafc;
      border: 1px solid #e5e9f2;
      border-radius: 14px;
      padding: 20px 24px;
      text-align: center;
    }

    .answer-label {
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 8px;
    }

    .answer-text {
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
    }

    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      user-select: none;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-show {
      background: var(--primary);
      color: #fff;
      font-size: 18px;
      padding: 14px 40px;
      box-shadow: 0 6px 16px rgba(79, 124, 255, 0.35);
    }

    .btn-restart {
      background: var(--primary);
      color: #fff;
      font-size: 18px;
      padding: 14px 40px;
      box-shadow: 0 6px 16px rgba(79, 124, 255, 0.35);
    }

    .btn-judge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      font-size: 30px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-correct {
      background: var(--success);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.35);
    }

    .btn-wrong {
      background: var(--danger);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
    }

    .hidden {
      display: none !important;
    }

    /* 首页选择区 */
    .home-area {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      background: linear-gradient(160deg, var(--bg-top), #e9efff);
      text-align: center;
    }

    .home-title {
      font-size: clamp(24px, 6vw, 40px);
      font-weight: 700;
      color: var(--text);
    }

    .home-subtitle {
      font-size: 15px;
      color: var(--text-soft);
      margin-top: -16px;
    }

    .home-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 760px;
    }

    .btn-mode {
      background: var(--primary);
      color: #fff;
      font-size: 20px;
      padding: 22px 48px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(79, 124, 255, 0.35);
    }

    /* 移动端适配 */
    @media (max-width: 600px) {
      .question-area, .control-area {
        padding: 18px;
      }
      .btn-show {
        padding: 12px 32px;
        font-size: 16px;
      }
      .btn-judge {
        width: 64px;
        height: 64px;
        font-size: 26px;
      }
    }
    .home-area { height: auto; min-height: 100%; gap: 22px; }
    .question-area { position: relative; padding-top: 72px; }
    .answer-box.show { max-height: 60vh; overflow-y: auto; }
    .answer-text { white-space: pre-line; text-align: left; }
    .btn-home-inline, select { padding: 12px 16px; border-radius: 10px; font: inherit; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #accountStatus, #saveStatus, #summary { font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
  </style>
</head>

        <button class="btn-mode" id="btnModeFourChar">四字成语</button>
      </div>
    </section>
  </div>

  <div class="app hidden" id="quizScreen">

    <section class="control-area">

        <div class="buttons hidden" id="judgeButtons">

        </div>
        <button class="btn-show hidden" id="btnSync">重试云端同步</button>
        <button class="btn-restart hidden" id="btnRestart">返回首页</button>
