<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽题背诵测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4f7cff;
      --success: #22c55e;
      --danger: #ef4444;
      --bg-top: #f5f7ff;
      --bg-bottom: #ffffff;
      --text: #1f2937;
      --text-soft: #6b7280;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: #eef1f8;
    }

    .app {
      height: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* 上半部分：问题区 */
    .question-area {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, var(--bg-top), #e9efff);
      text-align: center;
    }

    .counter {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 14px;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .btn-home {
      position: absolute;
      top: 12px;
      left: 20px;
      font-size: 14px;
      color: var(--primary);
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .question-label {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--primary);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: clamp(22px, 5vw, 36px);
      line-height: 1.5;
      font-weight: 700;
      max-width: 720px;
    }

    .question-text.empty {
      color: var(--text-soft);
      font-weight: 600;
    }

    /* 下半部分：交互区 */
    .control-area {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-bottom);
      gap: 20px;
    }

    /* 答案区，带平滑过渡 */
    .answer-box {
      width: 100%;
      max-width: 600px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(8px);
      transition: max-height 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
    }

    .answer-box.show {
      max-height: 400px;
      opacity: 1;
      transform: translateY(0);
    }

    .answer-card {
      background: #f8fafc;
      border: 1px solid #e5e9f2;
      border-radius: 14px;
      padding: 20px 24px;
      text-align: center;
    }

    .answer-label {
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 8px;
    }

    .answer-text {
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
    }

    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      user-select: none;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-show {
      background: var(--primary);
      color: #fff;
      font-size: 18px;
      padding: 14px 40px;
      box-shadow: 0 6px 16px rgba(79, 124, 255, 0.35);
    }

    .btn-restart {
      background: var(--primary);
      color: #fff;
      font-size: 18px;
      padding: 14px 40px;
      box-shadow: 0 6px 16px rgba(79, 124, 255, 0.35);
    }

    .btn-judge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      font-size: 30px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-correct {
      background: var(--success);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.35);
    }

    .btn-wrong {
      background: var(--danger);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
    }

    .hidden {
      display: none !important;
    }

    /* 首页选择区 */
    .home-area {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      background: linear-gradient(160deg, var(--bg-top), #e9efff);
      text-align: center;
    }

    .home-title {
      font-size: clamp(24px, 6vw, 40px);
      font-weight: 700;
      color: var(--text);
    }

    .home-subtitle {
      font-size: 15px;
      color: var(--text-soft);
      margin-top: -16px;
    }

    .home-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-mode {
      background: var(--primary);
      color: #fff;
      font-size: 20px;
      padding: 22px 48px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(79, 124, 255, 0.35);
    }

    /* 移动端适配 */
    @media (max-width: 600px) {
      .question-area, .control-area {
        padding: 18px;
      }
      .btn-show {
        padding: 12px 32px;
        font-size: 16px;
      }
      .btn-judge {
        width: 64px;
        height: 64px;
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="homeScreen">
    <section class="home-area">
      <div class="home-title">抽题背诵测试</div>
      <div class="home-subtitle">请选择练习类型</div>
      <div class="home-buttons">
        <button class="btn-mode" id="btnModePercent">百化分</button>
        <button class="btn-mode" id="btnModePower">次方数</button>
      </div>
    </section>
  </div>

  <div class="app hidden" id="quizScreen">
    <section class="question-area">
      <button class="btn-home" id="btnHome">← 返回首页</button>
      <div class="counter" id="counter"></div>
      <div class="question-label" id="questionLabel">问题</div>
      <div class="question-text" id="questionText">加载中…</div>
    </section>

    <section class="control-area">
      <div class="answer-box" id="answerBox">
        <div class="answer-card">
          <div class="answer-label">答案</div>
          <div class="answer-text" id="answerText"></div>
        </div>
      </div>

      <div class="buttons">
        <button class="btn-show" id="btnShow">查看答案</button>
        <div class="buttons hidden" id="judgeButtons">
          <button class="btn-judge btn-correct" id="btnCorrect" title="已掌握">√</button>
          <button class="btn-judge btn-wrong" id="btnWrong" title="未掌握">×</button>
        </div>
        <button class="btn-restart hidden" id="btnRestart">重新开始</button>
      </div>
    </section>
  </div>

  <script>
    // 百化分题库（百分比 → 对应分数）
    const percentBank = [
      { question: "5.3%", answer: "1/19" },
      { question: "5.6%", answer: "1/18" },
      { question: "5.9%", answer: "1/17" },
      { question: "6.25%", answer: "1/16" },
      { question: "6.7%", answer: "1/15" },
      { question: "7.1%", answer: "1/14" },
      { question: "7.7%", answer: "1/13" },
      { question: "8.3%", answer: "1/12" },
      { question: "9.1%", answer: "1/11" },
      { question: "9.5%", answer: "1/10.5" },
      { question: "10.5%", answer: "1/9.5" },
      { question: "11.1%", answer: "1/9" },
      { question: "12%", answer: "1/8.3" },
      { question: "12.5%", answer: "1/8" },
      { question: "13%", answer: "1/7.7" },
      { question: "14%", answer: "1/7.1" },
      { question: "14.3%", answer: "1/7" },
      { question: "15%", answer: "1/6.7" },
      { question: "16%", answer: "1/6.25" },
      { question: "16.7%", answer: "1/6" },
      { question: "17%", answer: "1/5.9" },
      { question: "18%", answer: "1/5.6" },
      { question: "19%", answer: "1/5.3" },
      { question: "20%", answer: "1/5" },
      { question: "22.2%", answer: "1/4.5" },
      { question: "24%", answer: "1/4.2" },
      { question: "27%", answer: "1/3.7" },
      { question: "28.6%", answer: "1/3.5" },
      { question: "30%", answer: "1/3.3" },
      { question: "33%", answer: "1/3" },
      { question: "37%", answer: "1/2.7" },
      { question: "40%", answer: "1/2.5" },
      { question: "42%", answer: "1/2.4" },
      { question: "60%", answer: "1/1.66" },
      { question: "64%", answer: "1/1.56" },
      { question: "67%", answer: "1/1.5" },
    ];

    // 次方数题库
    const powerBank = [
      { question: "11²", answer: "121" },
      { question: "12²", answer: "144" },
      { question: "13²", answer: "169" },
      { question: "14²", answer: "196" },
      { question: "15²", answer: "225" },
      { question: "16²", answer: "256" },
      { question: "17²", answer: "289" },
      { question: "18²", answer: "324" },
      { question: "19²", answer: "361" },
      { question: "21²", answer: "441" },
      { question: "22²", answer: "484" },
      { question: "23²", answer: "529" },
      { question: "24²", answer: "576" },
      { question: "25²", answer: "625" },
      { question: "26²", answer: "676" },
      { question: "27²", answer: "729" },
      { question: "28²", answer: "784" },
      { question: "29²", answer: "841" },
      { question: "1.1³", answer: "1.3" },
      { question: "1.2³", answer: "1.7" },
      { question: "1.3³", answer: "2.2" },
      { question: "1.4³", answer: "2.7" },
      { question: "1.1⁴", answer: "1.46" },
      { question: "1.2⁴", answer: "2.0" },
      { question: "1.3⁴", answer: "2.9" },
      { question: "1.4⁴", answer: "3.8" },
    ];

    // 当前使用的初始题库（根据首页选择而定）
    let initialBank = [];

    // 当前题库（从初始题库深拷贝一份，避免污染原始数据）
    let questionBank = [];

    let currentIndex = -1;

    const homeScreen = document.getElementById('homeScreen');
    const quizScreen = document.getElementById('quizScreen');
    const btnModePercent = document.getElementById('btnModePercent');
    const btnModePower = document.getElementById('btnModePower');
    const questionText = document.getElementById('questionText');
    const questionLabel = document.getElementById('questionLabel');
    const answerBox = document.getElementById('answerBox');
    const answerText = document.getElementById('answerText');
    const btnShow = document.getElementById('btnShow');
    const judgeButtons = document.getElementById('judgeButtons');
    const btnCorrect = document.getElementById('btnCorrect');
    const btnWrong = document.getElementById('btnWrong');
    const btnRestart = document.getElementById('btnRestart');
    const counter = document.getElementById('counter');
    const btnHome = document.getElementById('btnHome');

    // 隐藏答案与判断按钮，恢复到“查看答案”状态
    function resetControls() {
      answerBox.classList.remove('show');
      judgeButtons.classList.add('hidden');
      btnRestart.classList.add('hidden');
      btnShow.classList.remove('hidden');
    }

    // 随机抽取并显示下一题
    function showRandomQuestion() {
      resetControls();

      if (questionBank.length === 0) {
        questionLabel.classList.add('hidden');
        questionText.textContent = "题库已清空";
        questionText.classList.add('empty');
        btnShow.classList.add('hidden');
        judgeButtons.classList.add('hidden');
        answerBox.classList.remove('show');
        btnRestart.classList.remove('hidden');
        counter.textContent = "剩余 0 题";
        currentIndex = -1;
        return;
      }

      questionLabel.classList.remove('hidden');
      questionText.classList.remove('empty');

      currentIndex = Math.floor(Math.random() * questionBank.length);
      questionText.textContent = questionBank[currentIndex].question;
      counter.textContent = "剩余 " + questionBank.length + " 题";
    }

    // 查看答案
    btnShow.addEventListener('click', function () {
      if (currentIndex < 0) return;
      answerText.textContent = questionBank[currentIndex].answer;
      answerBox.classList.add('show');
      btnShow.classList.add('hidden');
      judgeButtons.classList.remove('hidden');
    });

    // √ 已掌握：从题库删除当前题，切换下一题
    btnCorrect.addEventListener('click', function () {
      if (currentIndex < 0) return;
      questionBank.splice(currentIndex, 1);
      showRandomQuestion();
    });

    // × 未掌握：保留题目，切换下一题
    btnWrong.addEventListener('click', function () {
      showRandomQuestion();
    });

    // 重新开始：回到首页重新选择
    btnRestart.addEventListener('click', function () {
      goHome();
    });

    // 返回首页
    function goHome() {
      quizScreen.classList.add('hidden');
      homeScreen.classList.remove('hidden');
    }

    // 答题界面：返回首页按钮
    btnHome.addEventListener('click', function () {
      goHome();
    });

    // 以指定题库开始一轮练习
    function startQuiz(bank) {
      initialBank = bank;
      questionBank = initialBank.map(function (item) { return { ...item }; });
      homeScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      showRandomQuestion();
    }

    // 首页：选择百化分
    btnModePercent.addEventListener('click', function () {
      startQuiz(percentBank);
    });

    // 首页：选择次方数
    btnModePower.addEventListener('click', function () {
      startQuiz(powerBank);
    });
  </script>
</body>
</html>
